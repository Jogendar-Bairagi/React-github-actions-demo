name: "first workflow"
on: 
  push:
  pull_request:
jobs: 
  first-job:
    runs-on: ubuntu-latest
    steps:
    
      - name: checkout
        uses: actions/checkout@v4
      
  
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with: 
          node-version: '24'
          cache: 'npm'

      - name: install dependency
        run: npm ci

      - name: run test case
        run : npm test

      - name: make react build
        run: npm run build

      - name :  artifacts
        uses: actions/upload-artifact@v4
        with:
          name: react-dist
          path: dist/
